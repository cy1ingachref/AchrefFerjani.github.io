name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The site is a self-contained static folder (no build step needed).
      # Its contents are uploaded and served at the site root.
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: standalone

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
